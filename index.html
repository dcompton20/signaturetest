<!DOCTYPE html>
<html>
<head>
  <title>Customer Signature</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f5f5f5;
    }

    .sig-container {
      background: #fff;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 560px;
      width: 90%;
    }

    .sig-container h2 {
      margin-bottom: 5px;
      color: #333;
    }

    .sig-container p.instructions {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }

    #sigCanvas {
      border: 2px solid #333;
      border-radius: 4px;
      cursor: crosshair;
      display: block;
      margin: 0 auto 15px;
      touch-action: none;
      width: 100%;
      max-width: 500px;
      height: 200px;
    }

    .mode-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .mode-topaz {
      background: #e8f5e9;
      color: #2E7D32;
      border: 1px solid #a5d6a7;
    }

    .mode-canvas {
      background: #fff3e0;
      color: #e65100;
      border: 1px solid #ffcc80;
    }

    .mode-detecting {
      background: #e3f2fd;
      color: #1565C0;
      border: 1px solid #90caf9;
    }

    .btn-row { margin-top: 10px; }

    .btn-row button {
      padding: 10px 24px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .btn-clear { background: #e0e0e0; color: #333; }
    .btn-sign  { background: #1565C0; color: #fff; font-weight: bold; }
    .btn-accept { background: #4CAF50; color: #fff; font-weight: bold; }
    .btn-accept:disabled { background: #a5d6a7; cursor: not-allowed; }

    #status {
      margin-top: 20px;
      font-size: 16px;
      font-weight: bold;
      min-height: 24px;
    }

    .status-waiting    { color: #1565C0; }
    .status-signing    { color: #F57C00; }
    .status-submitting { color: #F57C00; }
    .status-success    { color: #2E7D32; }
    .status-error      { color: #C62828; }
    .status-closing    { color: #666; }
  </style>
</head>
<body>
  <div class="sig-container">
    <h2>Customer Signature</h2>
    <div id="modeBadge" class="mode-badge mode-detecting">Detecting pad...</div>
    <p class="instructions">
      Please sign <span id="instructionTarget">in the box below</span> and tap <strong>Accept & Submit</strong>.
    </p>

    <canvas id="sigCanvas" width="500" height="200"></canvas>

    <div class="btn-row">
      <button class="btn-clear" onclick="handleClear()">Clear</button>
      <button class="btn-accept" id="btnAccept" onclick="acceptSignature()">Accept & Submit</button>
    </div>
    <p id="status" class="status-waiting">Waiting for signature...</p>
  </div>

  <!--
    ================================================================
    SigWeb SDK — loaded from Topaz's hosted JS.
    If SigWeb service is not installed / running on this machine,
    the script load will fail and we fall back to canvas signing.
    ================================================================
  -->
  <script src="https://www.sigplusweb.com/SigWebTablet.js"
          onerror="initCanvasFallback()"></script>

  <script>
    // ============================================================
    //  Configuration
    // ============================================================
    const SIG_IMAGE_WIDTH  = 500;
    const SIG_IMAGE_HEIGHT = 200;
    const SIG_PEN_WIDTH    = 5;

    // ============================================================
    //  DOM references
    // ============================================================
    const params        = new URLSearchParams(window.location.search);
    const ticketId      = params.get('ticketId');
    const statusEl      = document.getElementById('status');
    const btnAccept     = document.getElementById('btnAccept');
    const modeBadge     = document.getElementById('modeBadge');
    const instructionEl = document.getElementById('instructionTarget');
    const sigCanvas     = document.getElementById('sigCanvas');
    const sigCtx        = sigCanvas.getContext('2d');

    // ============================================================
    //  Mode tracking
    // ============================================================
    let useSigWeb    = false;   // true when Topaz pad is detected
    let sigWebTimer  = null;    // timer handle from SetTabletState
    let sigReady     = false;   // true once a signature has been captured
    let padActive    = false;   // true while Topaz pad is actively capturing

    // Canvas-fallback state
    let drawing    = false;
    let hasStrokes = false;

    // ============================================================
    //  Detect SigWeb on page load
    // ============================================================
    window.addEventListener('load', function () {
      detectSigWeb();
    });

    

function detectSigWeb() {
  try {
    // Check whether SigWeb is installed
    if (typeof IsSigWebInstalled !== 'function' || !IsSigWebInstalled()) {
      console.warn('SigWeb is not installed.');
      initCanvasFallback();
      return;
    }

    // Attempt to initialize tablet communication safely
    try {
      ClearTablet();
      SetTabletState(1);   // attempt activation
      SetTabletState(0);   // immediately deactivate
    } catch (e) {
      console.warn('SigWeb installed, but no Topaz device present.');
      initCanvasFallback();
      return;
    }

    // If we reached here, a device responded
    enableTopazMode();

  } catch (e) {
    console.error('Topaz detection failed. Falling back to canvas.', e);
    initCanvasFallback();
  }
}

    // ============================================================
    //  TOPAZ MODE
    // ============================================================
    
function enableTopazMode() {
  useSigWeb = true;

  modeBadge.className = 'mode-badge mode-topaz';
  modeBadge.textContent = 'Topaz Pad Connected';
  instructionEl.textContent = 'on the signature pad';

  sigCanvas.style.cursor = 'default';

  SetDisplayXSize(SIG_IMAGE_WIDTH);
  SetDisplayYSize(SIG_IMAGE_HEIGHT);
  SetJustifyMode(0);

  // Automatically start capturing
  startTopazCapture();
}

    
function startTopazCapture() {
  if (!useSigWeb || padActive) return;

  try {
    ClearTablet();
    sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);

    sigReady = false;
    padActive = true;

    sigWebTimer = SetTabletState(1, sigCtx, 50) || sigWebTimer;

    statusEl.className = 'status-signing';
    statusEl.innerText = 'Please sign on the pad now...';
  } catch (e) {
    statusEl.className = 'status-error';
    statusEl.innerText = 'Signature pad not detected. Switching to canvas mode.';
    initCanvasFallback();
  }
}


function stopTopazCapture() {
      if (NumberOfTabletPoints() === 0) {
        statusEl.className = 'status-error';
        statusEl.innerText = 'No signature detected. Please sign on the pad.';
        return;
      }

      // Deactivate the pad (CRITICAL before page close per Topaz docs)
      SetTabletState(0, sigWebTimer);
      padActive = false;
      sigReady = true;
      statusEl.className = 'status-waiting';
      statusEl.innerText = 'Signature captured! Tap "Accept & Submit" or "Re-sign".';
    }

    /**
     * Get signature as Base64 image from Topaz, wrapped in a Promise.
     * GetSigImageB64 is callback-based — this makes it awaitable.
     */
    function getTopazImageAsync() {
      return new Promise(function (resolve) {
        SetImageXSize(SIG_IMAGE_WIDTH);
        SetImageYSize(SIG_IMAGE_HEIGHT);
        SetImagePenWidth(SIG_PEN_WIDTH);
		
		// IMPORTANT: Force PNG output
		SetImageFileFormat(1); // 1 = PNG per Topaz SigWeb docs

        GetSigImageB64(function (b64String) {
          // Topaz returns raw Base64 BMP data.
          // Wrap as a data URL to match the format the API expects.
          resolve('data:image/png;base64,' + b64String);
        });
      });
    }

    // ============================================================
    //  CANVAS FALLBACK MODE
    // ============================================================
    function initCanvasFallback() {
      useSigWeb = false;

      modeBadge.className = 'mode-badge mode-canvas';
      modeBadge.textContent = 'Canvas Mode (no pad detected)';
      instructionEl.textContent = 'in the box below';
      
      sigCtx.lineWidth = 2;
      sigCtx.lineCap = 'round';
      sigCtx.strokeStyle = '#000';

      sigCanvas.addEventListener('mousedown', canvasDown);
      sigCanvas.addEventListener('mousemove', canvasMove);
      sigCanvas.addEventListener('mouseup', canvasUp);
      sigCanvas.addEventListener('mouseleave', canvasUp);
      sigCanvas.addEventListener('touchstart', canvasTouchDown);
      sigCanvas.addEventListener('touchmove', canvasTouchMove);
      sigCanvas.addEventListener('touchend', canvasUp);

      statusEl.className = 'status-waiting';
      statusEl.innerText = 'Waiting for signature...';
    }

    function getPos(e) {
      const rect = sigCanvas.getBoundingClientRect();
      const scaleX = sigCanvas.width / rect.width;
      const scaleY = sigCanvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function canvasDown(e) {
      drawing = true; hasStrokes = true;
      const pos = getPos(e);
      sigCtx.beginPath();
      sigCtx.moveTo(pos.x, pos.y);
    }
    function canvasMove(e) {
      if (!drawing) return;
      const pos = getPos(e);
      sigCtx.lineTo(pos.x, pos.y);
      sigCtx.stroke();
    }
    function canvasUp() { drawing = false; }
    function canvasTouchDown(e) { e.preventDefault(); canvasDown(e); }
    function canvasTouchMove(e) { e.preventDefault(); canvasMove(e); }

    function getCanvasImage() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = sigCanvas.width;
      tempCanvas.height = sigCanvas.height;
      const tempCtx = tempCanvas.getContext('2d');
      tempCtx.fillStyle = '#FFFFFF';
      tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
      tempCtx.drawImage(sigCanvas, 0, 0);
      return tempCanvas.toDataURL('image/png');
    }

    // ============================================================
    //  SHARED CONTROLS
    // ============================================================
    
function handleClear() {
  sigCtx.clearRect(0, 0, sigCanvas.width, sigCanvas.height);

  if (useSigWeb) {
    try {
      // Stop tablet if active
      if (padActive) {
        SetTabletState(0, sigWebTimer);
        padActive = false;
      }

      // Clear tablet memory
      ClearTablet();
      sigReady = false;

      // Auto-restart capture
      startTopazCapture();

    } catch (e) {
      statusEl.className = 'status-error';
      statusEl.innerText = 'Signature pad error. Switching to canvas mode.';
      initCanvasFallback();
      return;
    }

  } else {
    // Canvas fallback
    hasStrokes = false;
    statusEl.className = 'status-waiting';
    statusEl.innerText = 'Waiting for signature...';
  }

  btnAccept.disabled = false;
}


    async function acceptSignature() {
      let dataUrl;

      if (useSigWeb) {
        // ---- TOPAZ PATH ----
        // If pad is still actively capturing, auto-stop it
        if (padActive) {
          if (NumberOfTabletPoints() === 0) {
            statusEl.className = 'status-error';
            statusEl.innerText = 'Please sign on the pad before submitting.';
            return;
          }
          SetTabletState(0, sigWebTimer);
          padActive = false;
          sigReady = true;
          }

        if (!sigReady) {
          statusEl.className = 'status-error';
          statusEl.innerText = 'Please sign on the pad first.';
          return;
        }

        btnAccept.disabled = true;
        statusEl.className = 'status-submitting';
        statusEl.innerText = 'Capturing signature image...';
        dataUrl = await getTopazImageAsync();

      } else {
        // ---- CANVAS FALLBACK PATH ----
        if (!hasStrokes) {
          statusEl.className = 'status-error';
          statusEl.innerText = 'Please sign before submitting.';
          return;
        }
        btnAccept.disabled = true;
        dataUrl = getCanvasImage();
      }

      // Submit to HaloITSM
      statusEl.className = 'status-submitting';
      statusEl.innerText = 'Submitting signature...';
      await postSignature(dataUrl);
    }

    // ============================================================
    //  POST to HaloITSM (unchanged from your original)
    // ============================================================
    async function postSignature(base64sig) {
  try {
    const res = await fetch('SignatureHandler.ashx', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        ticketId: parseInt(ticketId),
        signature: base64sig
      })
    });

    if (res.ok) {
      statusEl.className = 'status-success';
      statusEl.innerText = 'Signature saved! Closing this window...';

      setTimeout(() => {
        window.close();
        statusEl.className = 'status-closing';
        statusEl.innerText = 'Signature saved! You may close this tab.';
      }, 2000);
    } else {
      const err = await res.text();
      statusEl.className = 'status-error';
      statusEl.innerText = 'Error: ' + err;
      btnAccept.disabled = false;
    }

  } catch (e) {
    statusEl.className = 'status-error';
    statusEl.innerText = 'Failed: ' + e.message;
    btnAccept.disabled = false;
  }
}

    // ============================================================
    //  CRITICAL: Deactivate pad on page unload.
    //  Topaz docs require this to avoid locking the hardware pad.
    // ============================================================
    window.addEventListener('beforeunload', function () {
      if (useSigWeb && padActive) {
        try { SetTabletState(0, sigWebTimer); } catch (e) {}
      }
    });
  </script>
</body>
</html>
