<!DOCTYPE html>
<html>
<head>
  <style>
    .iframe-container {
      position: relative;
      width: 100%;
      height: 100vh;
    }
    .iframe-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-container">
    <iframe
      src="https://davidaugust25.haloitsm.com/portal/dashboard?id=4&publishedid=b2a1ab8d-95db-4ca4-a542-87275a508d25"
      allowfullscreen
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      referrerpolicy="no-referrer-when-downgrade">
      <p>Your browser doesn't support iframes. <a href="YOUR_LINK_HERE">Open the link directly</a>.</p>
    </iframe>
  </div>
</body>
</html>
